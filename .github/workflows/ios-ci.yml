name: iOS Simulator CI

# Generates the Xcode project, compiles the real app, runs pure Swift domain
# tests and XCTest unit/UI journeys on an iPhone Simulator, then validates the
# uploaded evidence. A simulator is not a physical iPhone: AR tracking, camera
# output, audio sync and thermal behaviour remain device gates.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

# The runner image rolls without notice, so the workflow selects an Xcode 26.x
# rather than trusting one path: the preferred build is used when present, the
# newest 26.x otherwise, and the choice plus the full inventory goes into the job
# summary. No supported Xcode 26.x means a hard failure, never a silent guess.
env:
  SECOND_SHOT_PREFERRED_XCODE: /Applications/Xcode_26.6.app
  SECOND_SHOT_XCODE_SERIES: Xcode_26

jobs:
  simulator:
    name: Build and test on iPhone Simulator
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned
        with:
          persist-credentials: false

      - name: Select and report the Xcode toolchain
        run: |
          set -euo pipefail
          mkdir -p artifacts/ios
          {
            echo "### Xcode toolchain"
            echo
            echo '```'
            ls /Applications | sort
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

          SELECTED="${SECOND_SHOT_PREFERRED_XCODE}"
          if [[ ! -d "${SELECTED}" ]]; then
            echo "::warning::${SECOND_SHOT_PREFERRED_XCODE} is absent from this runner image; falling back to the newest installed ${SECOND_SHOT_XCODE_SERIES}."
            SELECTED="$(ls -d /Applications/${SECOND_SHOT_XCODE_SERIES}*.app 2>/dev/null | sort -V | tail -1 || true)"
          fi
          if [[ -z "${SELECTED}" || ! -d "${SELECTED}" ]]; then
            echo "::error::No supported ${SECOND_SHOT_XCODE_SERIES}.x is installed on this runner. The job summary lists what is available; update .github/workflows/ios-ci.yml and docs/CI_WORKFLOW.md deliberately."
            echo "no-supported-xcode" > artifacts/ios/toolchain.status
            exit 1
          fi

          echo "DEVELOPER_DIR=${SELECTED}/Contents/Developer" >> "${GITHUB_ENV}"
          export DEVELOPER_DIR="${SELECTED}/Contents/Developer"
          # Each probe is allowed to fail so its reason reaches the summary
          # before the job stops; a genuinely unusable Xcode still fails below.
          {
            echo "--- xcodebuild -version"
            xcodebuild -version || echo "xcodebuild -version failed with $?"
            echo "--- simulator SDK"
            xcrun --sdk iphonesimulator --show-sdk-version || echo "simulator SDK probe failed with $?"
            echo "--- swift"
            swift --version || echo "swift probe failed with $?"
            echo "--- python3"
            python3 --version || echo "python3 probe failed with $?"
          } 2>&1 | tee artifacts/ios/toolchain.txt
          {
            echo
            echo "Selected: \`${SELECTED}\`"
            echo
            echo '```'
            cat artifacts/ios/toolchain.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

          if ! xcodebuild -version > /dev/null 2>&1; then
            echo "::error::xcodebuild is unusable with ${DEVELOPER_DIR}; the toolchain block in the job summary records what happened."
            echo "xcodebuild-unusable" > artifacts/ios/toolchain.status
            exit 1
          fi

      - name: Capture environment and simulator inventory
        run: python3 -B scripts/ci/capture_environment.py

      - name: Install pinned XcodeGen
        run: bash scripts/ci/install_xcodegen.sh

      - name: Generate the Xcode project
        run: |
          set -euo pipefail
          mkdir -p artifacts/ios
          .tools/xcodegen/bin/xcodegen --version
          .tools/xcodegen/bin/xcodegen generate --spec project.yml 2>&1 | tee artifacts/ios/xcodegen.log

      - name: Run pure Swift domain tests
        run: |
          set -o pipefail
          mkdir -p artifacts/ios
          swift test --enable-code-coverage 2>&1 | tee artifacts/ios/swift-test.log

      - name: Build and run simulator unit and UI tests
        run: bash scripts/ci/run_simulator_tests.sh

      # The session layer introduced real concurrent work, so the phase asks for the
      # race diagnostics the toolchain supports. Unit suites only: the UI journeys
      # are slow under instrumentation and are not where the actor graph is tested.
      - name: Concurrency diagnostics under Thread Sanitizer
        run: bash scripts/ci/run_concurrency_diagnostics.sh

      - name: Surface failure details as annotations
        if: always()
        run: |
          set +e
          {
            echo "### Failure diagnostics"
            echo
          } >> "${GITHUB_STEP_SUMMARY}"
          for log in artifacts/ios/toolchain.txt artifacts/ios/xcodegen.log artifacts/ios/xcodebuild.log artifacts/ios/swift-test.log artifacts/ios/collection.json; do
            [[ -f "$log" ]] || continue
            echo "---- $log (first errors) ----"
            grep -E "error: |FAIL " "$log" | head -10 | while IFS= read -r line; do
              echo "::error::$log: $line"
            done
            echo "---- $log (tail) ----"
            tail -n 30 "$log"
            {
              echo "<details><summary>${log}</summary>"
              echo
              echo '```'
              tail -n 60 "$log"
              echo '```'
              echo "</details>"
            } >> "${GITHUB_STEP_SUMMARY}"
          done
          exit 0

      - name: Collect and validate evidence
        if: always()
        run: python3 -B scripts/ci/collect_results.py

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 pinned
        with:
          name: ios-evidence-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
