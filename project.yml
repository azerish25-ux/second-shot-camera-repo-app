# XcodeGen specification — the source of truth for the generated Xcode project.
# `SecondShot.xcodeproj` is generated in CI and ignored by git.
name: SecondShot

options:
  bundleIdPrefix: app.secondshot
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

packages:
  SecondShot:
    path: .

targets:
  SecondShot:
    type: application
    platform: iOS
    sources:
      - path: Sources/SecondShotApp
    dependencies:
      - package: SecondShot
        product: SecondShotCore
    info:
      path: .generated/SecondShot-Info.plist
      properties:
        CFBundleDisplayName: Second Shot
        CFBundleName: SecondShot
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.secondshot.studio
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    scheme:
      testTargets:
        - SecondShotAppTests
        - SecondShotUITests
      gatherCoverageData: true

  SecondShotAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/SecondShotAppTests
    dependencies:
      - target: SecondShot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.secondshot.studio.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SecondShot.app/SecondShot"
        BUNDLE_LOADER: "$(TEST_HOST)"

  SecondShotUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/SecondShotUITests
    dependencies:
      - target: SecondShot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.secondshot.studio.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SecondShot
